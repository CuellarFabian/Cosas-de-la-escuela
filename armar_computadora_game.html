  .game-header p {

  }
  
  .progress-bar-wrap {
    background: rgba(255,255,255,0.15);

    height: 10px;
    width: 80%;
    margin: 10px auto 0;
    overflow: hidden;
  }
  
  .progress-bar-fill {
    height: 100%;
    background: #7ef4ff;
    border-radius: 20px;
    transition: width 0.5s ease;

  }
  
  .progress-label {
    font-size: 12px;
    color: #aaccff;
    margin-top: 4px;
    text-align: center;
  }
  
  .main-layout {
    display: flex;

    padding: 10px;
    max-width: 900px;
    margin: 0 auto;
    align-items: flex-start;
  }
  
  .pc-zone {
    flex: 1;
    min-width: 280px;
  }
  
  .pc-title {
    font-family: 'Fredoka One', cursive;
    font-size: 15px;
    color: #1a1a2e;
    text-align: center;
    margin-bottom: 8px;
  }
  
  .pc-canvas {
    background: white;
    border-radius: 16px;

    padding: 10px;
    min-height: 480px;

  .pc-canvas.has-gabinete {

    border-color: #4a90d9;
  }
  
  .slot {
    position: absolute;
    display: flex;
    align-items: center;

    border-radius: 8px;
    font-size: 10px;
    font-weight: 700;
    color: #aab4ff;
    border: 2px dashed #dde3ff;
    background: rgba(240,244,255,0.6);

    flex-direction: column;
    text-align: center;
    gap: 2px;
  }
  
  .slot.filled {
    border: 2px solid #4cd97b;
    background: rgba(76,217,123,0.08);
    color: transparent;
  }
  
  .slot.highlight {
    border-color: #7ef4ff;
    background: rgba(126,244,255,0.15);
    animation: pulse-slot 0.8s infinite alternate;
  }
  
  @keyframes pulse-slot {
    from { box-shadow: 0 0 0 0 rgba(126,244,255,0.4); }
    to { box-shadow: 0 0 0 6px rgba(126,244,255,0); }
  }
  
  .slot svg {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  
  .right-panel {
    width: 290px;
    flex-shrink: 0;
  }
  
  .category-section {
    background: white;
    border-radius: 14px;
    padding: 10px;
    margin-bottom: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  
  .cat-title {
    font-family: 'Fredoka One', cursive;
    font-size: 13px;
    color: #1a1a2e;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  
  .cat-title .cat-icon {
    font-size: 14px;
  }
  
  .components-grid {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  
  .component-card {
    width: 82px;
    background: #f5f7ff;
    border-radius: 10px;
    border: 2px solid #dde3ff;
    padding: 6px 4px;
    cursor: grab;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transition: all 0.2s;
    user-select: none;
    font-size: 10px;
    font-weight: 700;
    color: #4a4a6a;
    text-align: center;
  }
  
  .component-card:hover:not(.used) {
    border-color: #7a8aff;
    background: #eef0ff;
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(122,138,255,0.25);
  }
  
  .component-card.used {
    opacity: 0.35;
    cursor: not-allowed;
    border-color: #4cd97b;
  }
  
  .component-card.dragging {
    opacity: 0.5;
    transform: scale(0.95);
  }
  
  .component-card svg {
    display: block;
  }

    position: absolute;
    top: 6px;
    right: 6px;
    background: #4cd97b;
    color: white;

    font-size: 10px;
    border-radius: 20px;
    padding: 2px 8px;
    display: none;
  }
  
  .slot.filled .success-badge { display: block; }
  
  .completion-banner {
    display: none;
    position: fixed;

    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
  }
  
  .btn-restart:hover {
    background: #3a3a6e;
    transform: scale(1.05);
  }

    font-size: 48px;
    animation: bounce-star 0.6s ease infinite alternate;
    display: block;
    margin-bottom: 12px;
  }

    from { transform: scale(1); }
    to { transform: scale(1.2) rotate(10deg); }
  }

    background: #1a1a2e;
    color: #7ef4ff;

    font-size: 12px;
    text-align: center;
    padding: 6px;
    letter-spacing: 0.5px;

    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
  }

    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
  }

const EXTERNAL_CATS = ['monitor','mouse','teclado','webcam','audio'];
const TOTAL = CATEGORIES.length;
let placed = {};
let dragging = null;
let gabineteSet = false;
let gabineteType = null;

function buildPanel() {
  const panel = document.getElementById('components-panel');
  panel.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const sec = document.createElement('div');
    sec.className = 'category-section';
    sec.id = 'cat-sec-' + cat.id;
    const title = document.createElement('div');
    title.className = 'cat-title';
    title.id = 'cat-title-' + cat.id;
    title.innerHTML = `<span class="cat-icon">${cat.icon}</span> ${cat.label}`;
    sec.appendChild(title);
    const grid = document.createElement('div');
    grid.className = 'components-grid';
    cat.components.forEach(comp => {
      const card = document.createElement('div');
      card.className = 'component-card';
      card.id = 'card-' + comp.id;
      card.draggable = true;
      card.innerHTML = comp.svg + `<span>${comp.name}</span>`;
      card.setAttribute('data-cat', cat.id);
      card.setAttribute('data-comp', comp.id);
      card.addEventListener('dragstart', onDragStart);
      card.addEventListener('dragend', onDragEnd);
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    panel.appendChild(sec);
  });
}

function buildSlots() {
  const canvas = document.getElementById('pc-canvas');
  const canvasW = canvas.offsetWidth || 280;
  const canvasH = canvas.offsetHeight || 480;
  
  CATEGORIES.forEach(cat => {
    if (cat.external) return;
    const s = cat.slot;
    const el = document.createElement('div');
    el.className = 'slot';
    el.id = 'slot-' + cat.id;
    const px = (s.x / 100) * canvasW;
    const py = (s.y / 100) * canvasH;
    const pw = (s.w / 100) * canvasW;
    const ph = (s.h / 100) * canvasH;
    el.style.cssText = `left:${px}px;top:${py}px;width:${pw}px;height:${ph}px;`;
    el.innerHTML = `<span style="font-size:9px;opacity:0.6;">${s.label}</span>`;
    el.setAttribute('data-cat', cat.id);
    el.addEventListener('dragover', onDragOver);
    el.addEventListener('drop', onDrop);
    el.addEventListener('dragleave', onDragLeave);
    canvas.appendChild(el);
  });
}

function onDragStart(e) {
  const cat = e.currentTarget.getAttribute('data-cat');
  const comp = e.currentTarget.getAttribute('data-comp');
  if (e.currentTarget.classList.contains('used')) { e.preventDefault(); return; }
  if (cat !== 'gabinete' && !gabineteSet) {
    setStatus('¡Primero colocá el gabinete!', '#e53935');
    e.preventDefault();
    return;
  }
  dragging = { cat, comp };
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function onDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
}

function onDragOver(e) {
  e.preventDefault();
  const slotCat = e.currentTarget.getAttribute('data-cat');
  if (dragging && dragging.cat === slotCat && !e.currentTarget.classList.contains('filled')) {
    e.currentTarget.classList.add('drop-target-active');
    e.dataTransfer.dropEffect = 'move';
  }
}

function onDragLeave(e) {
  e.currentTarget.classList.remove('drop-target-active');
}

function onDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('drop-target-active');
  if (!dragging) return;
  const slotCat = e.currentTarget.getAttribute('data-cat');
  if (dragging.cat !== slotCat) {
    setStatus('¡Ese componente no va ahí!', '#e53935');
    return;
  }
  if (e.currentTarget.classList.contains('filled')) {
    setStatus('¡Ya hay un componente ahí!', '#ff8f00');
    return;
  }
  placeComponent(dragging.cat, dragging.comp, e.currentTarget);
  dragging = null;
}

function placeComponent(catId, compId, slotEl) {
  const cat = CATEGORIES.find(c => c.id === catId);
  const comp = cat.components.find(c => c.id === compId);
  
  placed[catId] = compId;
  
  if (catId === 'gabinete') {
    gabineteSet = true;
    gabineteType = compId;
    document.getElementById('no-gabinete-msg').style.display = 'none';
    document.getElementById('pc-canvas').classList.add('has-gabinete');
    applyGabineteStyle(compId);
    showInternalSlots();
  }
  
  slotEl.classList.add('filled');
  slotEl.innerHTML = comp.svg;
  
  const card = document.getElementById('card-' + compId);
  if (card) card.classList.add('used');
  
  const catTitle = document.getElementById('cat-title-' + catId);
  if (catTitle) catTitle.classList.add('cat-done');
  
  const numPlaced = Object.keys(placed).length;
  updateProgress(numPlaced);
  
  setStatus(getPlaceMessage(cat.label, comp.name), '#4cd97b');
  
  if (numPlaced === TOTAL) {
    setTimeout(() => {
      document.getElementById('completion-banner').classList.add('show');
    }, 800);
  }
}

function applyGabineteStyle(gabId) {
  const canvas = document.getElementById('pc-canvas');
  const colors = {
    'gab_oficina': { border: '#90a4ae', bg: '#f5f7f8' },
    'gab_gamer1': { border: '#e53935', bg: '#1a0000' },
    'gab_gamer2': { border: '#7c4dff', bg: '#0d0020' }
  };
  const style = colors[gabId] || colors['gab_oficina'];
  canvas.style.borderColor = style.border;
  canvas.style.background = style.bg;
}

function showInternalSlots() {
  CATEGORIES.forEach(cat => {
    if (cat.external) {
      handleExternalCategory(cat);
    }
  });
}

function handleExternalCategory(cat) {
  const catSec = document.getElementById('cat-sec-' + cat.id);
  if (catSec) {
    const dropZone = document.createElement('div');
    dropZone.id = 'ext-slot-' + cat.id;
    dropZone.style.cssText = 'border:2px dashed #aab4ff;border-radius:10px;padding:10px;margin-top:6px;text-align:center;font-size:11px;color:#aab4ff;font-family:Nunito,sans-serif;transition:all 0.3s;';
    dropZone.innerHTML = '📥 Arrastrá aquí el ' + cat.label;
    dropZone.setAttribute('data-cat', cat.id);
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (dragging && dragging.cat === cat.id && !dropZone.classList.contains('filled')) {
        dropZone.style.borderColor = '#7ef4ff';
        dropZone.style.background = 'rgba(126,244,255,0.1)';
      }
    });
    dropZone.addEventListener('dragleave', () => {
      dropZone.style.borderColor = '#aab4ff';
      dropZone.style.background = '';
    });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.style.borderColor = '#aab4ff';
      dropZone.style.background = '';
      if (!dragging || dragging.cat !== cat.id) {
        setStatus('¡Ese componente no va ahí!', '#e53935');
        return;
      }
      if (dropZone.classList.contains('filled')) return;
      const compObj = CATEGORIES.find(c=>c.id===cat.id).components.find(c=>c.id===dragging.comp);
      placed[cat.id] = dragging.comp;
      dropZone.classList.add('filled');
      dropZone.innerHTML = `<div style="display:flex;align-items:center;gap:8px;"><div style="width:40px;height:40px;flex-shrink:0;">${compObj.svg}</div><div><div style="font-weight:700;font-size:12px;color:#4cd97b;">${compObj.name}</div><div style="font-size:10px;color:#aaa;">✅ Conectado</div></div></div>`;
      dropZone.style.border = '2px solid #4cd97b';
      const card = document.getElementById('card-' + dragging.comp);
      if (card) card.classList.add('used');
      const catTitle = document.getElementById('cat-title-' + cat.id);
      if (catTitle) catTitle.classList.add('cat-done');
      const numPlaced = Object.keys(placed).length;
      updateProgress(numPlaced);
      setStatus(getPlaceMessage(cat.label, compObj.name), '#4cd97b');
      if (numPlaced === TOTAL) {
        setTimeout(() => { document.getElementById('completion-banner').classList.add('show'); }, 800);
      }
      dragging = null;
    });
    catSec.appendChild(dropZone);
  }
}

function getPlaceMessage(catLabel, compName) {
  const msgs = [
    `¡Genial! ${compName} colocado/a ✅`,
    `¡Excelente! ${catLabel} instalado/a 🎉`,
    `¡Muy bien! La PC toma forma 💪`,
    `¡Perfecto! Seguí armando 🚀`,
    `¡Eso es! ${compName} en su lugar ⚡`
  ];
  return msgs[Math.floor(Math.random() * msgs.length)];
}

function updateProgress(num) {
  const pct = (num / TOTAL) * 100;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `${num} / ${TOTAL} componentes`;
}

function setStatus(msg, color) {
  const bar = document.getElementById('status-bar');
  bar.textContent = msg;
  bar.style.color = color || '#7ef4ff';
}

function restartGame() {
  placed = {};
  gabineteSet = false;
  gabineteType = null;
  dragging = null;
  document.getElementById('completion-banner').classList.remove('show');
  document.getElementById('pc-canvas').innerHTML = '<div class="needs-gabinete-msg" id="no-gabinete-msg"><span>📦</span> Primero colocá<br>el gabinete</div>';
  document.getElementById('pc-canvas').style.cssText = '';
  document.getElementById('pc-canvas').classList.remove('has-gabinete');
  document.getElementById('prog-fill').style.width = '0%';
  document.getElementById('prog-label').textContent = '0 / ' + TOTAL + ' componentes';
  setStatus('¡Empezá colocando el gabinete!', '#7ef4ff');
  buildPanel();
  setTimeout(buildSlots, 50);
}

buildPanel();
setTimeout(buildSlots, 80);
</script>
